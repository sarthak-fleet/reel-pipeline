<!doctype html><html lang="en"><meta charset="utf-8"><title>Compare rates, not totals — synthetic lesson</title><style>*{box-sizing:border-box}body{margin:0;background:#0c181b;color:#f6f8f6;font-family:system-ui}main{padding:64px;width:1080px;min-height:850px}small{font-size:27px;color:#77d7c3}h1{font-size:70px;line-height:1.05;margin:30px 0}table{width:100%;border-collapse:collapse;font-size:44px;text-align:left}th,td{padding:24px 12px;border-bottom:2px solid #476064}th{font-size:28px;color:#b5c8c8}.rate{font-weight:800;color:#77d7c3}p{font-size:40px;line-height:1.3}</style><main><small>SYNTHETIC TEACHING EXAMPLE · NO REAL STUDY</small><h1>Compare rates,<br>not totals.</h1><table><tr><th>Group</th><th>Completed / total</th><th>Rate</th></tr><tr><td>A</td><td>8 / 10</td><td class="rate">80%</td></tr><tr><td>B</td><td>12 / 20</td><td class="rate">60%</td></tr></table><p>B has more completions.<br>A has the higher completion rate.</p><small>Calculation: completed ÷ total × 100</small></main></html>
